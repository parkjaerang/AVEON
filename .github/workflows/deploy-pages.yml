# GitHub Pages (Repository → Settings → Pages):
#   Source: Deploy from a branch
#   Branch: web  ·  Folder: /(root)
#
# `web` 브랜치 루트에 빌드된 index.html + assets/ 가 올라가야 이미지·JS가 보입니다.
name: Deploy GitHub Pages

on:
  push:
    branches: [main, web]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare dist
        run: |
          node scripts/write-spa-404.mjs
          touch dist/.nojekyll

      - name: Sync built site to docs/ on main
        if: github.ref == 'refs/heads/main'
        run: |
          node scripts/sync-docs.mjs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet && echo "No docs changes" && exit 0
          git commit -m "chore: deploy site to docs [skip ci]"
          git push

      - name: Publish web branch (Pages root)
        if: github.ref == 'refs/heads/main'
        run: node scripts/publish-web-branch.mjs

      - name: Publish web branch from web
        if: github.ref == 'refs/heads/web'
        run: |
          node -e "import { syncWebRootFromDist } from './scripts/sync-docs.mjs'; syncWebRootFromDist();"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html assets .nojekyll favicon.svg docs og-share.png
          git diff --staged --quiet && echo "No publish changes" && exit 0
          git commit -m "chore: publish site to web branch root [skip ci]"
          git push

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (Actions)
        id: deployment
        uses: actions/deploy-pages@v4
