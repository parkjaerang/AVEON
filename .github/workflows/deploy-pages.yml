# GitHub Pages (Repository → Settings → Pages):
#   Source: Deploy from a branch
#   Branch: web  ·  Folder: /docs
#
# 개발: main · 배포: web (main 빌드 후 Actions가 web 브랜치를 갱신)
name: Deploy GitHub Pages

on:
  push:
    branches: [main, web]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare dist
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Sync built site to docs/
        run: |
          rm -rf docs
          cp -r dist docs
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet && echo "No docs changes" && exit 0
          git commit -m "chore: deploy site to docs [skip ci]"
          git push

      - name: Publish web branch for GitHub Pages
        if: github.ref == 'refs/heads/main'
        run: git push origin HEAD:web

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (Actions)
        id: deployment
        uses: actions/deploy-pages@v4
